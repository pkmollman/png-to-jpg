# Builds the app with Trunk and publishes it to GitHub Pages.
#
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". The site is then served at
# https://<user>.github.io/<repository-name>/ and updates on every push.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the latest push deploys; an older run still in progress is cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  TRUNK_VERSION: v0.22.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with the WebAssembly target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv trunk /usr/local/bin/
          trunk --version

      # Pages serves the site from /<repository-name>/, so asset URLs need that prefix.
      # Trunk also downloads wasm-opt here (index.html asks for it) to shrink the .wasm files.
      - name: Build
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
